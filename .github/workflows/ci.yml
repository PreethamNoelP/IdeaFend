name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run offline safety-guard tests
        run: python3 plugins/idea-lab/scripts/selftest.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Validate plugin manifest (best-effort; may need auth we don't have in CI)
        continue-on-error: true
        run: claude plugin validate ./plugins/idea-lab
